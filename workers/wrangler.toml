name = "datasip"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "c5a70b9a15f68cd2596d7ce8ebb9a2a6"

# 定时任务
[triggers]
crons = ["0 * * * *", "0 */2 * * *", "0 20 * * *"]
# 0 * * * *    = 每小时整点 (RSS 抓取)
# 0 */2 * * *  = 每 2 小时 (YouTube 抓取)
# 0 20 * * *   = 每天 20:00 (每日匹配触发)

# 环境变量 (非敏感)
[vars]
ENVIRONMENT = "production"

# 敏感变量通过 wrangler secret put 设置:
# - TELEGRAM_BOT_TOKEN
# - N8N_WEBHOOK_URL
# - N8N_WEBHOOK_SECRET
# - ALLOWED_USER_IDS (逗号分隔的 Telegram User ID)
