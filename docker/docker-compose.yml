version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: datasip-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datasip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-datasip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasip"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: datasip-n8n
    restart: always
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
      # 数据库配置 (N8N 自己的数据)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=datasip
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-datasip}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # 加密密钥
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # 应用密钥
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # LLM API
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORTKEY_API_KEY_user=${PORTKEY_API_KEY_user}
      - PORTKEY_API_KEY_service=${PORTKEY_API_KEY_service}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/data/workflows:ro
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
